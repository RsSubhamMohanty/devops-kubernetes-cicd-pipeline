apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "devsecops-app.fullname" . }}-read-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "devsecops-app.fullname" . }}-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "devsecops-app.fullname" . }}-read-config
  apiGroup: rbac.authorization.k8s.io
