apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devsecops-app.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  APP_ENV: {{ .Values.app.environment | quote }}
  PORT: {{ .Values.app.port | quote }}
