apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devsecops-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devsecops-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.app.port }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
