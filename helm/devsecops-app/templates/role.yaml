apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "devsecops-app.fullname" . }}-read-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - {{ include "devsecops-app.fullname" . }}-config
    verbs:
      - get
